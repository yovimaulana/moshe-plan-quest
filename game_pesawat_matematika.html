<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petualangan Pesawat Matematika</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js untuk Efek Suara (Audio Synthesizer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        /* Custom Keyframe Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1)); }
        }
        .glow-effect {
            animation: pulse-glow 2s infinite;
        }
        /* Style Canvas Game */
        #gameCanvas {
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
        }
    </style>
</head>
<body class="bg-slate-900 text-white overflow-hidden h-screen w-screen flex flex-col justify-between items-center select-none">

    <!-- Header Stats Bar -->
    <header class="w-full max-w-4xl px-4 py-2 flex justify-between items-center z-10 bg-slate-800/80 backdrop-blur border-b-4 border-yellow-400 rounded-b-2xl shadow-lg">
        <div class="flex items-center gap-2 bg-yellow-500/20 px-3 py-1.5 rounded-full border border-yellow-400">
            <i class="fa-solid fa-trophy text-yellow-400 text-xl animate-bounce"></i>
            <span class="text-sm md:text-base font-bold text-yellow-300">Skor:</span>
            <span id="scoreText" class="font-game text-xl md:text-2xl text-yellow-400">0</span>
        </div>

        <div class="flex items-center gap-2 bg-rose-500/20 px-3 py-1.5 rounded-full border border-rose-400">
            <i class="fa-solid fa-heart text-rose-500 text-xl animate-pulse"></i>
            <div id="livesContainer" class="flex gap-1 text-rose-500 text-lg">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>

        <button id="soundToggleBtn" class="bg-indigo-600 hover:bg-indigo-500 p-2.5 rounded-full border-2 border-indigo-300 transition-all active:scale-95">
            <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
        </button>
    </header>

    <!-- Main Game Canvas Container -->
    <main class="relative w-full flex-1 max-w-4xl my-2 flex items-center justify-center overflow-hidden rounded-3xl border-4 border-indigo-500/40 shadow-2xl">
        <canvas id="gameCanvas" class="w-full h-full block rounded-2xl"></canvas>

        <!-- Start Screen Overlay -->
        <div id="startScreen" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20">
            <div class="animate-float mb-4">
                <i class="fa-solid fa-plane-up text-7xl text-cyan-400 glow-effect"></i>
            </div>
            <h1 class="font-game text-4xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-400 mb-3 drop-shadow-md">
                Kuis Pesawat Terbang!
            </h1>
            <p class="text-slate-300 max-w-md mb-6 text-sm md:text-base">
                Kendalikan pesawatmu, nabrak <b>Kotak Misteri</b>, dan jawab soal penjumlahan & pengurangan matematika untuk mendapat skor tertinggi!
            </p>
            <button id="startBtn" class="font-game bg-gradient-to-r from-green-400 to-emerald-600 hover:from-green-300 hover:to-emerald-500 text-slate-950 text-2xl px-10 py-4 rounded-full border-4 border-white shadow-xl hover:scale-105 active:scale-95 transition-all">
                <i class="fa-solid fa-play mr-2"></i> MULAI MAIN!
            </button>
        </div>

        <!-- Question Modal Overlay -->
        <div id="questionModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-lg flex items-center justify-center p-4 z-30">
            <div class="bg-gradient-to-b from-indigo-900 to-slate-900 border-4 border-yellow-400 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl transform transition-all scale-100">
                <div class="inline-block bg-yellow-400 text-slate-950 font-game px-4 py-1 rounded-full text-sm mb-4 uppercase tracking-wider">
                    Soal Matematika!
                </div>
                <div id="questionText" class="font-game text-4xl md:text-5xl text-yellow-300 mb-6 drop-shadow-lg tracking-wide">
                    25 + 37 = ?
                </div>
                
                <form id="answerForm" onsubmit="return false;" class="flex flex-col gap-4">
                    <input type="number" id="answerInput" pattern="[0-9]*" inputmode="numeric" placeholder="Ketik jawaban..." autofocus autocomplete="off" class="w-full text-center font-game text-3xl bg-slate-800 border-4 border-cyan-400 rounded-2xl p-3 text-cyan-300 focus:outline-none focus:border-yellow-400 focus:ring-4 focus:ring-yellow-400/30 transition-all">
                    
                    <button type="submit" id="submitAnswerBtn" class="font-game bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 text-2xl py-3 rounded-2xl border-2 border-white shadow-lg active:scale-95 transition-all">
                        JAWAB <i class="fa-solid fa-paper-plane ml-1"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Game Over Modal Overlay -->
        <div id="gameOverModal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center z-40">
            <i class="fa-solid fa-face-frown text-7xl text-rose-500 mb-3 animate-bounce"></i>
            <h2 class="font-game text-4xl md:text-5xl text-rose-400 mb-2">Permainan Selesai!</h2>
            <p class="text-slate-300 text-lg mb-4">Kamu sudah berjuang dengan hebat!</p>
            
            <div class="bg-slate-800/80 border-2 border-yellow-400/50 rounded-2xl p-4 mb-6 w-64">
                <span class="text-slate-400 text-sm block mb-1">Skor Akhir Kamu:</span>
                <span id="finalScore" class="font-game text-4xl text-yellow-400">0</span>
            </div>

            <button id="restartBtn" class="font-game bg-gradient-to-r from-cyan-400 to-blue-600 hover:from-cyan-300 hover:to-blue-500 text-slate-950 text-2xl px-8 py-3 rounded-full border-4 border-white shadow-xl active:scale-95 transition-all">
                <i class="fa-solid fa-rotate-right mr-2"></i> MAIN LAGI
            </button>
        </div>
    </main>

    <!-- On-Screen Touch Controls (Mobile/Tab Supported) -->
    <footer class="w-full max-w-xl px-4 pb-3 pt-1 flex justify-between items-center gap-4 z-10">
        <!-- Directional D-Pad Left/Right/Up/Down -->
        <div class="grid grid-cols-3 gap-2 w-full max-w-[220px] mx-auto">
            <div></div>
            <button id="btnUp" class="bg-slate-800/80 hover:bg-indigo-600 border-2 border-indigo-400 text-cyan-300 font-bold p-3 rounded-xl flex justify-center items-center active:bg-indigo-500 active:scale-90 transition-all shadow-md touch-none">
                <i class="fa-solid fa-chevron-up text-xl"></i>
            </button>
            <div></div>
            
            <button id="btnLeft" class="bg-slate-800/80 hover:bg-indigo-600 border-2 border-indigo-400 text-cyan-300 font-bold p-3 rounded-xl flex justify-center items-center active:bg-indigo-500 active:scale-90 transition-all shadow-md touch-none">
                <i class="fa-solid fa-chevron-left text-xl"></i>
            </button>
            <button id="btnDown" class="bg-slate-800/80 hover:bg-indigo-600 border-2 border-indigo-400 text-cyan-300 font-bold p-3 rounded-xl flex justify-center items-center active:bg-indigo-500 active:scale-90 transition-all shadow-md touch-none">
                <i class="fa-solid fa-chevron-down text-xl"></i>
            </button>
            <button id="btnRight" class="bg-slate-800/80 hover:bg-indigo-600 border-2 border-indigo-400 text-cyan-300 font-bold p-3 rounded-xl flex justify-center items-center active:bg-indigo-500 active:scale-90 transition-all shadow-md touch-none">
                <i class="fa-solid fa-chevron-right text-xl"></i>
            </button>
        </div>
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // --- GAME SOUND EFFECTS ENGINE (Tone.js) ---
        let soundEnabled = true;

        // Sound FX Synthesizers
        const synth = new Tone.Synth().toDestination();
        const polySynth = new Tone.PolySynth(Tone.Synth).toDestination();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }

                const now = Tone.now();
                if (type === 'start') {
                    polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
                } else if (type === 'hit') {
                    synth.triggerAttackRelease("G5", "16n", now);
                } else if (type === 'correct') {
                    polySynth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                } else if (type === 'wrong') {
                    polySynth.triggerAttackRelease(["F3", "C3"], "8n", now);
                } else if (type === 'gameover') {
                    polySynth.triggerAttackRelease(["C4", "G3", "E3", "C3"], "4n", now);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Toggle Sound Mute
        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg text-rose-400';
            }
        });

        // --- GAME CORE ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // State Game
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let activeQuestionBox = null;
        let currentAnswer = 0;

        // Resize Canvas Adaptively
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Pesawat (Player)
        const plane = {
            x: 0,
            y: 0,
            width: 60,
            height: 60,
            speed: 6,
            dx: 0,
            dy: 0
        };

        // Inputs Keyboard
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            w: false,
            a: false,
            s: false,
            d: false
        };

        // Elements Arrays
        let stars = [];
        let clouds = [];
        let boxes = [];

        // Colors Palette for 4 Mystery Boxes
        const boxColors = [
            { bg: '#f59e0b', border: '#fbbf24', text: '#78350f' }, // Yellow/Amber
            { bg: '#ec4899', border: '#f472b6', text: '#831843' }, // Pink
            { bg: '#06b6d4', border: '#22d3ee', text: '#164e63' }, // Cyan
            { bg: '#a855f7', border: '#c084fc', text: '#581c87' }  // Purple
        ];

        // Init Starfield Background
        function initBackground() {
            stars = [];
            for (let i = 0; i < 50; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1,
                    speed: Math.random() * 1.5 + 0.5
                });
            }

            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 30 + 20,
                    speed: Math.random() * 0.8 + 0.2
                });
            }
        }

        // Spawn 4 Question Boxes
        function spawnBoxes() {
            boxes = [];
            const boxSize = 65;
            const padding = 20;
            const availableWidth = canvas.width - boxSize - padding * 2;

            for (let i = 0; i < 4; i++) {
                // Distribute evenly horizontally across 4 lanes
                const laneWidth = availableWidth / 4;
                const x = padding + (i * laneWidth) + Math.random() * (laneWidth - boxSize);
                const y = -100 - (Math.random() * 150); // Stagger initial Y offset

                boxes.push({
                    id: i + 1,
                    x: x,
                    y: y,
                    width: boxSize,
                    height: boxSize,
                    speed: Math.random() * 1.2 + 1.8,
                    color: boxColors[i % boxColors.length],
                    rotation: 0,
                    pulse: 0
                });
            }
        }

        // Reset Plane Position
        function resetPlane() {
            plane.x = canvas.width / 2 - plane.width / 2;
            plane.y = canvas.height - plane.height - 30;
            plane.dx = 0;
            plane.dy = 0;
        }

        // --- MATH QUESTION GENERATOR ---
        function generateMathQuestion() {
            const isAddition = Math.random() > 0.5;
            let num1, num2, answer;

            if (isAddition) {
                // Penjumlahan kompleks hingga total <= 100
                num1 = Math.floor(Math.random() * 80) + 10;
                num2 = Math.floor(Math.random() * (99 - num1)) + 5;
                answer = num1 + num2;
                document.getElementById('questionText').innerHTML = `${num1} + ${num2} = ?`;
            } else {
                // Pengurangan kompleks 1-100
                num1 = Math.floor(Math.random() * 85) + 15;
                num2 = Math.floor(Math.random() * (num1 - 5)) + 5;
                answer = num1 - num2;
                document.getElementById('questionText').innerHTML = `${num1} - ${num2} = ?`;
            }

            currentAnswer = answer;
        }

        // --- EVENT LISTENERS (CONTROLS & TOUCH) ---
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
            }
        });

        // Touch Control Buttons for Mobile/Tabs
        function setupTouchButton(btnId, keyName) {
            const btn = document.getElementById(btnId);
            const startPress = (e) => {
                e.preventDefault();
                keys[keyName] = true;
            };
            const endPress = (e) => {
                e.preventDefault();
                keys[keyName] = false;
            };

            btn.addEventListener('touchstart', startPress);
            btn.addEventListener('touchend', endPress);
            btn.addEventListener('mousedown', startPress);
            btn.addEventListener('mouseup', endPress);
            btn.addEventListener('mouseleave', endPress);
        }

        setupTouchButton('btnUp', 'ArrowUp');
        setupTouchButton('btnDown', 'ArrowDown');
        setupTouchButton('btnLeft', 'ArrowLeft');
        setupTouchButton('btnRight', 'ArrowRight');

        // Drag/Touch direct control on Canvas
        let isDragging = false;
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            movePlaneToTouch(e.touches[0]);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                movePlaneToTouch(e.touches[0]);
            }
        });
        canvas.addEventListener('touchend', () => { isDragging = false; });

        function movePlaneToTouch(touch) {
            const rect = canvas.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;

            plane.x = Math.max(0, Math.min(canvas.width - plane.width, touchX - plane.width / 2));
            plane.y = Math.max(0, Math.min(canvas.height - plane.height, touchY - plane.height / 2));
        }

        // --- DRAWING FUNCTIONS ---

        // Draw Player Plane SVG Path
        function drawPlane() {
            ctx.save();
            ctx.translate(plane.x + plane.width / 2, plane.y + plane.height / 2);

            // Slight tilt effect when moving left/right
            if (keys.ArrowLeft || keys.a) ctx.rotate(-0.15);
            if (keys.ArrowRight || keys.d) ctx.rotate(0.15);

            // Plane Body (Colorful Jet)
            ctx.beginPath();
            // Tail
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(-8, 15, 16, 12);

            // Wings
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.moveTo(-30, 5);
            ctx.lineTo(30, 5);
            ctx.lineTo(0, -15);
            ctx.closePath();
            ctx.fill();

            // Fuselage
            ctx.fillStyle = '#fbbc05';
            ctx.beginPath();
            ctx.ellipse(0, 0, 14, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cockpit Window
            ctx.fillStyle = '#60a5fa';
            ctx.beginPath();
            ctx.ellipse(0, -8, 8, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Thruster Flame Animation
            ctx.fillStyle = Math.random() > 0.5 ? '#f97316' : '#ef4444';
            ctx.beginPath();
            ctx.moveTo(-6, 25);
            ctx.lineTo(6, 25);
            ctx.lineTo(0, 35 + Math.random() * 8);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Draw Mystery Boxes
        function drawBoxes() {
            boxes.forEach(box => {
                ctx.save();
                ctx.translate(box.x + box.width / 2, box.y + box.height / 2);

                // Pulse Effect
                box.pulse += 0.05;
                const scale = 1 + Math.sin(box.pulse) * 0.05;
                ctx.scale(scale, scale);

                // Box Shadow
                ctx.shadowColor = box.color.border;
                ctx.shadowBlur = 12;

                // Box Body
                ctx.fillStyle = box.color.bg;
                ctx.strokeStyle = box.color.border;
                ctx.lineWidth = 4;

                const r = 12; // Rounded Corner
                const w = box.width;
                const h = box.height;
                const x = -w / 2;
                const y = -h / 2;

                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Box Question Mark Icon / Label
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px "Fredoka One", cursive';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('?', 0, 0);

                ctx.restore();
            });
        }

        // Draw Background Elements (Stars & Clouds)
        function drawBackground() {
            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Draw Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.radius * 0.7, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x - cloud.radius * 0.7, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();

                cloud.y += cloud.speed;
                if (cloud.y - cloud.radius > canvas.height) {
                    cloud.y = -cloud.radius * 2;
                    cloud.x = Math.random() * canvas.width;
                }
            });
        }

        // --- GAME UPDATE LOOP ---
        function update() {
            if (!gameRunning) return;

            // Plane Keyboard Movement Logic
            if ((keys.ArrowLeft || keys.a) && plane.x > 0) {
                plane.x -= plane.speed;
            }
            if ((keys.ArrowRight || keys.d) && plane.x < canvas.width - plane.width) {
                plane.x += plane.speed;
            }
            if ((keys.ArrowUp || keys.w) && plane.y > 0) {
                plane.y -= plane.speed;
            }
            if ((keys.ArrowDown || keys.s) && plane.y < canvas.height - plane.height) {
                plane.y += plane.speed;
            }

            // Move Question Boxes Downward
            boxes.forEach(box => {
                box.y += box.speed;

                // Collision Detection (Bounding Box)
                if (
                    plane.x < box.x + box.width &&
                    plane.x + plane.width > box.x &&
                    plane.y < box.y + box.height &&
                    plane.y + plane.height > box.y
                ) {
                    // Hit Box! Trigger Question Modal
                    triggerQuestion(box);
                }

                // Reset box position if it moves off-screen
                if (box.y > canvas.height + 50) {
                    box.y = -100 - (Math.random() * 100);
                    box.x = Math.random() * (canvas.width - box.width);
                }
            });

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawBoxes();
            drawPlane();

            requestAnimationFrame(update);
        }

        // Trigger Question Popup
        function triggerQuestion(box) {
            gameRunning = false;
            activeQuestionBox = box;
            playSound('hit');

            generateMathQuestion();

            // Display Modal UI
            const modal = document.getElementById('questionModal');
            modal.classList.remove('hidden');

            const input = document.getElementById('answerInput');
            input.value = '';
            setTimeout(() => input.focus(), 100);
        }

        // Submit Answer Logic
        document.getElementById('answerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('answerInput');
            const userAnswer = parseInt(input.value.trim(), 10);

            const modal = document.getElementById('questionModal');
            modal.classList.add('hidden');

            if (!isNaN(userAnswer) && userAnswer === currentAnswer) {
                // Correct Answer!
                playSound('correct');
                score += 10;
                document.getElementById('scoreText').innerText = score;

                // Remove / Reset current box
                if (activeQuestionBox) {
                    activeQuestionBox.y = -150;
                    activeQuestionBox.x = Math.random() * (canvas.width - activeQuestionBox.width);
                }
            } else {
                // Wrong Answer!
                playSound('wrong');
                lives--;
                updateLivesUI();

                if (lives <= 0) {
                    gameOver();
                    return;
                }
            }

            // Resume Game Loop
            gameRunning = true;
            requestAnimationFrame(update);
        });

        // Update Heart Lives UI
        function updateLivesUI() {
            const container = document.getElementById('livesContainer');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < lives) {
                    container.innerHTML += '<i class="fa-solid fa-heart animate-pulse"></i>';
                } else {
                    container.innerHTML += '<i class="fa-solid fa-heart text-slate-600"></i>';
                }
            }
        }

        // Start Game Function
        function startGame() {
            Tone.start();
            playSound('start');

            score = 0;
            lives = 3;
            document.getElementById('scoreText').innerText = score;
            updateLivesUI();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverModal').classList.add('hidden');

            resizeCanvas();
            initBackground();
            resetPlane();
            spawnBoxes();

            gameRunning = true;
            requestAnimationFrame(update);
        }

        // Game Over Logic
        function gameOver() {
            gameRunning = false;
            playSound('gameover');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        // Button Click Handlers
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Window Load Initialization
        window.onload = function() {
            resizeCanvas();
            initBackground();
        };
    </script>
</body>
</html>
